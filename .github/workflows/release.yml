name: Release Build & Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify and Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Verify
        uses: ./.github/actions/build-verify

      - name: Package Extension (Zip dist/)
        run: |
          cd dist
          zip -r ../yt-blinders-${{ github.ref_name }}.zip .
          cd ..

      - name: Upload Extension Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: yt-blinders-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
